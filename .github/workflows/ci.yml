name: continuous integration (CI)
on:
  push:
    paths:
      - main/**

jobs:
  test-go-binary:
    runs-on: ubuntu-latest

    timeout-minutes: 3
    steps:
      - name: Checkout branch
        uses: actions/checkout@v3

      - name: Install golang
        uses: actions/setup-go@v3
        with:
          go-version-file: 'main/.go-version'

      - name: Run unit tests
        run: |
          cd main/
          go mod tidy
          go test ./... --cover
